<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>search_nearby</title>
    <link rel="stylesheet" href="https://cache.amap.com/lbs/static/main1119.css"/>
    <style type="text/css">
        #panel {
            position: fixed;
            background-color: white;
            max-height: 90%;
            overflow-y: auto;
            top: 10px;
            right: 10px;
            width: 280px;
            border-bottom: solid 1px silver;
        }
    </style>
    <style>
        .btn {
            text-align: center;
            padding: 2rem;
            width: 60%;
            height:10%;
            margin-top: 15rem;
            background-image: linear-gradient(to right, #a6c1ee, #fbc2eb);
            color: #fff;
            position: absolute; z-index: 10
        }
        .input-item {
            display: block;
            width: 50%;
            margin-bottom: 20rem;
            border: 0;
            padding: 10px;
            border-bottom: 1px solid rgb(128, 125, 125);
            font-size: 15px;
            outline: none;
            position: absolute;
            z-index: 10
        }
    </style>
    <div id="container"></div>
    <script type="text/javascript">
    window._AMapSecurityConfig = {
    securityJsCode: "f7bec2181f008568c61d9984750f1d35",
    };</script>
    <script
  type="text/javascript"
  src="https://webapi.amap.com/maps?v=2.0&key=1130a612091d60ccade5c924c35f2210"></script>

    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=1130a612091d60ccade5c924c35f2210"></script>
    <script type="text/javascript" src="https://cache.amap.com/lbs/static/addToolbar.js"></script>
</head>
<body>
<div id="container"></div>
<div id="panel"></div>
<input type="text" id="distance" placeholder="Maximum distance(Unit: meter)" class="input-item"  style = "margin-top: 31rem;">
<input type="text" id="keywords" placeholder="Keyword(s) of poi (Please enter Chinese) "
       class="input-item" style = "margin-top: 36rem;">
<input type = "button" class = 'btn' id = 'button' style = "margin-top: 40rem;"
       onclick="keywords_search()" value="Search nearby related POIs."></input>
<script src="./jquery.min.js"></script>
<script type="text/javascript">
        var search_distance;
        var pos = location.search;
        console.log("0pos is ",pos);
        pos=pos.slice(pos.indexOf("=")+1)
        console.log("1pos is ",pos);
        var lng = pos.substring(0,10);
        var lat = pos.substring(15,24);
        var cpoint = [Number(lng), Number(lat)]; //中心点坐标

        var name = pos.substring(30);
        <!--    Turn all the space(%20) in the name to real space.-->
        name = name.replace("%20", " ");
        <!--    Turn all the /(%2F) in the name to real %2F.-->
        name = name.replace("%2F", "/");
        <!--    Turn all the +(%2B) in the name to real +.-->
        name = name.replace("%2B", "+");
        <!--    Turn all the ?(%3F) in the name to real ?.-->
        name = name.replace("%3F", "?");
        <!--    Turn all the %(%25) in the name to real %.-->
        name = name.replace("%25", "%");
        <!--    Turn all the #(%23) in the name to real #.-->
        name = name.replace("%23", "#");
        <!--    Turn all the &(%26) in the name to real &.-->
        name = name.replace("%26", "&");
        <!--    Turn all the =(%3D) in the name to real =.-->
        name = name.replace("%3D", "=");

        console.log("name is ",name);
        var keywords;
    var map = new AMap.Map("container", {
        resizeEnable: true
    });
    AMap.plugin("AMap.PlaceSearch", function()
    {
        //构造地点查询类
        var placeSearch = new AMap.PlaceSearch({ 
            pageSize: 5, // 单页显示结果条数
            pageIndex: 1, // 页码
            map: map, // 展现结果的地图实例
            panel: "panel", // 结果列表将在此容器中进行展示。
            autoFitView: true // 是否自动调整地图视野使绘制的 Marker点都处于视口的可见范围
        });
        placeSearch.searchNearBy("吃", cpoint, 2000, function(status, result) {
        console.log(result);
        });
    });


function detect_age_and_save_preference()
        {
            $.ajax({
                type: "GET",
                url: "http://127.0.0.1:5000/search_nearby",
                data: { "name": name,"preference":keywords},
                dataType: "json",
                success:function (res)
                {
                    if (res.adult == false && (keywords == '酒吧'))
                    {
                        window.location.href = './search_nearby.html?'+'lng='+lng+'&'+'lat='+lat+'&'+'name='+name;
                        alert("Sorry, but you aren't old enough to go to these kind of places.");
                    }
                    else
                    {
                        var map = new AMap.Map("container", {
                        resizeEnable: true
                        });
                        AMap.plugin("AMap.PlaceSearch", function() {
                        //构造地点查询类
                    var placeSearch = new AMap.PlaceSearch({
                        pageSize: 5, // 单页显示结果条数
                        pageIndex: 1, // 页码
                        map: map, // 展现结果的地图实例
                        panel: "panel", // 结果列表将在此容器中进行展示。
                        autoFitView: true // 是否自动调整地图视野使绘制的 Marker点都处于视口的可见范围
                        });
                    placeSearch.searchNearBy(keywords, cpoint, Number(distance), function(status, result) {
                    console.log(result);
                    });
                });
                    }
                }
            });

        }


       function keywords_search()
       {
            distance = document.getElementById("distance").value
            keywords = document.getElementById("keywords").value
            detect_age_and_save_preference();
        }
</script>
</body>
</html>
